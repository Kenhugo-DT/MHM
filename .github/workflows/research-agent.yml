name: MHM research scout agent

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Where this run was triggered from."
        required: false
        default: "manual"
      limit:
        description: "Maximum queued/frontier requests to process."
        required: false
        default: "2"
      note:
        description: "Optional run note."
        required: false
        default: ""
  schedule:
    # Backup if the Supabase Cron dispatch did not complete successfully.
    - cron: "20 10 * * 1,4"

concurrency:
  group: mhm-research-agent
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  schedule-guard:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          since="$(date -u +%Y-%m-%d)T09:05:00Z"
          if ! response=$(curl -fsS --max-time 10 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/research-agent.yml/runs?event=workflow_dispatch&per_page=50"); then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if printf '%s' "$response" | jq -e --arg since "$since" \
            'any(.workflow_runs[]; .created_at >= $since and .conclusion == "success")' > /dev/null; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi
  scout:
    needs: schedule-guard
    if: needs.schedule-guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: brain/pipeline/requirements.txt
      - run: npm ci
      - run: pip install -r brain/pipeline/requirements.txt
      - name: Show trigger details
        run: |
          echo "Source: ${AGENT_TRIGGER_SOURCE:-manual}" >> "$GITHUB_STEP_SUMMARY"
          echo "Limit: ${AGENT_LIMIT:-2}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${AGENT_TRIGGER_NOTE:-}" ]; then
            echo "Note: ${AGENT_TRIGGER_NOTE}" >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          AGENT_TRIGGER_SOURCE: ${{ github.event.inputs.source || 'manual' }}
          AGENT_LIMIT: ${{ github.event.inputs.limit || '2' }}
          AGENT_TRIGGER_NOTE: ${{ github.event.inputs.note || '' }}
      - name: Run scout agent
        run: npm run brain:agent -- --source supabase --auto-queue-frontier --process --limit "${AGENT_LIMIT:-2}"
        env:
          AGENT_LIMIT: ${{ github.event.inputs.limit || '2' }}
          MUSICBRAINZ_CONTACT: ${{ secrets.MUSICBRAINZ_CONTACT }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scout-agent-output
          path: |
            brain/data/candidates/*.json
            brain/data/runs/*.json
          if-no-files-found: warn
          retention-days: 14
