name: MHM research scout agent

on:
  workflow_dispatch:
  schedule:
    # Wednesdays at 02:23 UTC. The agent writes review candidates only.
    - cron: "23 2 * * 3"

permissions:
  contents: read

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: brain/pipeline/requirements.txt
      - run: npm ci
      - run: pip install -r brain/pipeline/requirements.txt
      - name: Run scout agent
        run: npm run brain:agent -- --limit 2
        env:
          MUSICBRAINZ_CONTACT: ${{ secrets.MUSICBRAINZ_CONTACT }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scout-agent-output
          path: |
            brain/data/candidates/*.json
            brain/data/runs/*.json
          if-no-files-found: warn
          retention-days: 14
