name: Collect graph candidates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: brain/pipeline/requirements.txt
      - run: pip install -r brain/pipeline/requirements.txt
      - run: python brain/pipeline/sync.py
        env:
          MUSICBRAINZ_CONTACT: ${{ secrets.MUSICBRAINZ_CONTACT }}
      - uses: actions/upload-artifact@v4
        with:
          name: graph-candidates
          path: brain/data/candidates/research-candidates.json
          retention-days: 14
