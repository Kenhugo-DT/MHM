name: Process research inbox

on:
  workflow_dispatch:
  schedule:
    # Sundays at 03:17 UTC.
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  process-inbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: brain/pipeline/requirements.txt
      - run: pip install -r brain/pipeline/requirements.txt
      - run: python brain/pipeline/process_inbox.py
        env:
          MUSICBRAINZ_CONTACT: ${{ secrets.MUSICBRAINZ_CONTACT }}
      - uses: actions/upload-artifact@v4
        with:
          name: inbox-candidates
          path: |
            brain/data/candidates/*.json
            brain/data/runs/*.json
          if-no-files-found: warn
          retention-days: 14
