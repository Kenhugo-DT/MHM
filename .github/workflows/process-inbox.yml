name: Process research inbox

on:
  workflow_dispatch:
  schedule:
    # Sundays at 03:17 UTC.
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  process-inbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: brain/pipeline/requirements.txt
      - run: pip install -r brain/pipeline/requirements.txt
      - name: Process inbox
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SECRET_KEY" ]; then
            python brain/pipeline/process_inbox.py --source supabase --publish-candidates-to-supabase
          else
            echo "Supabase is not configured. Falling back to the local inbox file."
            python brain/pipeline/process_inbox.py
          fi
        env:
          MUSICBRAINZ_CONTACT: ${{ secrets.MUSICBRAINZ_CONTACT }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: inbox-candidates
          path: |
            brain/data/candidates/*.json
            brain/data/runs/*.json
          if-no-files-found: warn
          retention-days: 14
