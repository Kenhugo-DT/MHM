name: Validate project

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install -r brain/pipeline/requirements.txt
      - run: npm run brain:example-inbox
      - run: npm run brain:python-check
      - run: npm run brain:import:test
      - run: node brain/scripts/run-python.mjs -m unittest discover -s brain/pipeline/tests -p test_publish_connection_candidates.py
      - run: node brain/scripts/run-python.mjs -m unittest discover -s brain/pipeline/tests -p test_connection_promotion_isolation.py
      - run: node brain/scripts/run-python.mjs -m unittest discover -s brain/pipeline/tests -p test_finalize_connection_candidates.py
      - run: npm run brain:audit
      - run: npm test
      - run: npm run check
      - run: npm run build
