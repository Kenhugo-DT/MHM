name: Validate project

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install -r brain/pipeline/requirements.txt
      - run: npm run brain:example-inbox
      - run: npm run brain:python-check
      - run: node brain/scripts/run-python.mjs -m unittest discover -s brain/pipeline/tests -p 'test_*.py'
      - run: npm run brain:verify-snapshots
      - run: npm run brain:verify-edge-evidence
      - run: npm run brain:audit
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
